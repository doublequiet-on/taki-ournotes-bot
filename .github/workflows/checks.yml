name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  koishi-probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: koishi
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: koishi/.node-version
          package-manager-cache: false
      - name: Install locked candidate without lifecycle scripts
        run: npx --yes --package=npm@12.2.0 npm ci --ignore-scripts --no-audit --no-fund
      - name: Compile and probe installed adapter without QQ access
        run: |
          node node_modules/typescript/bin/tsc -p tsconfig.json
          node scripts/probe.cjs probe-output.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: koishi-offline-probe
          path: koishi/probe-output.json
          if-no-files-found: warn
          retention-days: 14

  architecture:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check architecture boundaries and negative cases
        run: |
          python -B scripts/check_architecture.py
          python -B -m unittest discover -s tests -p 'test_architecture.py' -v

  test-and-package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CJK font for image rendering test
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Install project
        run: |
          python -m pip install 'setuptools>=68'
          python -m pip install -e .
      - name: Run offline tests
        env:
          PYTHONPATH: src
          QQ_APP_ID: ''
          QQ_APP_SECRET: ''
          AI_API_KEY: ''
        run: python -B -m unittest discover -s tests -q
      - name: Build wheel and source archive
        run: |
          python -m pip wheel . --no-deps --no-build-isolation -w dist
          python -c "from setuptools.build_meta import build_sdist; build_sdist('dist')"
          python scripts/check_release_artifact.py dist
      - name: Verify isolated wheel and source installations
        run: |
          for package in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            install_dir=$(mktemp -d "$RUNNER_TEMP/taki-install.XXXXXX")
            python -m venv "$install_dir/venv"
            "$install_dir/venv/bin/python" -m pip install "$package"
            (cd "$install_dir" && "$install_dir/venv/bin/python" -I "$GITHUB_WORKSPACE/scripts/check_installed_query_upgrade.py")
          done

  offline-linux-bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install system font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Build locked Linux bundle
        run: python scripts/build_offline_release.py --output "$RUNNER_TEMP/offline-release"
      - name: Prove installation and regression with networking disabled
        run: |
          sudo unshare --net -- "$(command -v python)" scripts/check_offline_release.py \
            "$RUNNER_TEMP/offline-release/taki-linux-x86_64-cp312.zip" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-offline-release
          path: ${{ runner.temp }}/offline-release/
          if-no-files-found: error
          retention-days: 14

  koishi-combination:
    needs: offline-linux-bundle
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: koishi/.node-version
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-offline-release
          path: ${{ runner.temp }}/python-release
      - name: Install pinned gateway dependencies without lifecycle scripts
        working-directory: koishi
        run: npx --yes --package=npm@12.2.0 npm ci --ignore-scripts --no-audit --no-fund
      - name: Build paired release and controller recovery payload
        run: |
          python scripts/build_koishi_release.py --node "$(command -v node)" --python-artifact "$RUNNER_TEMP/python-release/taki-linux-x86_64-cp312.zip" --output "$RUNNER_TEMP/koishi-release/taki-koishi-linux-x64.zip"
          python -m zipfile -e "$RUNNER_TEMP/koishi-release/taki-koishi-linux-x64.zip" "$RUNNER_TEMP/combination-check"
          chmod +x "$RUNNER_TEMP/combination-check/bin/node"
          sudo unshare --net -- "$(command -v python)" scripts/check_koishi_release.py "$RUNNER_TEMP/combination-check" "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        with:
          name: koishi-combination
          path: ${{ runner.temp }}/koishi-release/
          if-no-files-found: error
          retention-days: 14

  publish-linux-bundle:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [architecture, test-and-package, offline-linux-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: linux-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: linux-offline-release
          path: ${{ runner.temp }}/offline-release
      - name: Publish exact commit bundle without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_offline_release.py "$RUNNER_TEMP/offline-release/taki-linux-x86_64-cp312.zip" "$GITHUB_SHA"
