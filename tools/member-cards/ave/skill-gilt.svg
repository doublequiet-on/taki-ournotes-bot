      <g fill="url(#high-leaf)" stroke="#735037" stroke-width=".55" stroke-linejoin="round">
        <path d="M0 6.9C-.2 4.8-2.3 3.7-4.3 3.1-4.4 1.9-5.8.1-5.6-1.8-3.5-1.4-2.4-.2-1.3 1.3-2-1.7-1.2-3.2 0-4.3 1.6-2.7 1.8-1 .9 1.5 2.2-.4 3.9-1.5 5.7-1.8 5.5.6 4.4 2.2 3.5 3.1 1.6 4.2.5 4.7 0 6.9Z"/>
        <path d="M0 4.8Q.8 2.5 0 .1M-2.3 2.3-4.1.3M2.1 2.2 4.1.1" fill="none" stroke="#9a6541" stroke-width=".62"/>
      </g>
    </g>
    <g id="side-leaf" stroke="#734f37" stroke-width=".55" stroke-linejoin="round">
      <path fill="url(#gilding)" d="M0-9C.8-5.7 3-5.9 3.3-3.9 3.6-2.4 2.5-1.4 1.4-1.7 3.9.4 4 2.1 2.8 3.8 2.3 2.8 1.8 2.5 1.1 2.3 1.6 5.3.1 6.4 0 9-1.4 6.2-2.3 5.1-1.7 2.7-4.6 1.3-4-1-1.9-2.9-3.1-5.6-.7-6.1 0-9Z"/>
      <path d="M-.9 1.6Q-1.9-1.5.1-3.6" fill="none" stroke="#edd199" stroke-width=".68"/>
