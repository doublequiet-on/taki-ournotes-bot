  <svg x="0" y="0" width="1" height="1" overflow="visible"><use href="#corner" transform="translate(4 4)"/></svg>
  <svg x="100%" y="0" width="1" height="1" overflow="visible"><use href="#corner" transform="translate(-4 4) scale(-1 1)"/></svg>
  <svg x="0" y="100%" width="1" height="1" overflow="visible"><use href="#corner" transform="translate(4 -4) scale(.84 -.84)"/></svg>
  <svg x="100%" y="100%" width="1" height="1" overflow="visible"><use href="#corner" transform="translate(-4 -4) scale(-.84 -.84)"/></svg>
  <svg x="50%" y="0" width="1" height="1" overflow="visible"><use href="#crest" transform="translate(0 4)"/></svg>
  <svg x="50%" y="100%" width="1" height="1" overflow="visible"><use href="#crest" transform="translate(0 -4) scale(.80 -.80)"/></svg>
  <svg x="0" y="50%" width="1" height="1" overflow="visible"><use href="#side-leaf" transform="translate(4 0)"/></svg>
  <svg x="100%" y="50%" width="1" height="1" overflow="visible"><use href="#side-leaf" transform="translate(-4 0) scale(-1 1)"/></svg>
</svg>
