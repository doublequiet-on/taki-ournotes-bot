<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <linearGradient id="gilding" x1=".18" y1="0" x2=".69" y2="1">
      <stop stop-color="#f3d899"/>
      <stop offset=".23" stop-color="#c49a63"/>
      <stop offset=".43" stop-color="#8d603e"/>
      <stop offset=".57" stop-color="#e6bd79"/>
      <stop offset=".74" stop-color="#b08450"/>
      <stop offset="1" stop-color="#74492f"/>
    </linearGradient>
    <linearGradient id="high-leaf" x1="0" y1="0" x2=".8" y2=".9">
