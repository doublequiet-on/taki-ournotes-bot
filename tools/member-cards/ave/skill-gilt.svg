      <path fill="url(#gilding)" d="M2.6 6.1C.3 7.7 1.2 10.5 1.7 12.5 2.1 14.4.7 16.2 1.4 18.4-1.6 17-2.1 14.8-1.5 12.6-3.6 11.3-3.6 8.7-2.1 7.1-1.5 6.4-.7 6.2.6 6.1Z"/>
      <path fill="url(#high-leaf)" d="M3.7 2.7C3-.7 4.3-2.8 6.3-3.6 6.1-2 7.6-2.2 7.2-.2 6.8 1.2 5.2 2 3.7 2.7Z"/>
      <path fill="url(#gilding)" d="M15.4 1.2C18.1-.5 19.6.2 21.8 1.9 24.3 3.7 26.5 3 29.2 1.4 27.3 4.3 23.9 5.1 21.3 3.7 18.9 2.3 17.8 1.9 16.1 3Z"/>
      <path fill="none" stroke="#f0d49b" stroke-width=".69" d="M-2-1.7Q1.3-1.6 2.3.6M15.4 1Q12.4.1 10.6 1.2M7.6 3.4C3.7 4.9 4.7 8.8 7.4 9.4M-.8 13.4Q-.3 11-1.1 9.9M20.7 2.3Q24.5 5.3 27.9 2.8"/>
      <path fill="none" stroke="#7c5038" stroke-width=".64" d="M.4 3.8Q1.7 2.1 2.4 2M7.9 10.3Q13 10.5 11.8 6.4"/>
